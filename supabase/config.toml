# Edge Functions Configuration
# verify_jwt controls whether functions require user authentication

# Test Hedera Credentials - requires authenticated users (dev tool, exposes key fingerprints)
[functions.test-hedera-credentials]
verify_jwt = true

# Register Batch - requires authentication (writes to HCS + database at operator expense)
[functions.register-batch]
verify_jwt = true

# Tokenize Batch - requires authentication (mints NFTs at operator expense)
[functions.tokenize-batch]
verify_jwt = true

# Verify Batch - Public access for NFT verification (scan-to-verify flow)
[functions.verify-batch]
verify_jwt = false

# Note: Even with verify_jwt = false, the apikey header is ALWAYS required
# verify_jwt = true requires BOTH apikey AND Authorization: Bearer <user_access_token>
# verify_jwt = false requires ONLY apikey header
